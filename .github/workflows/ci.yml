name: CI/CD — Grow2Stellar

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Soroban contract build & test
  # ─────────────────────────────────────────────────────────────────────────────
  contract:
    name: Soroban Contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build contract (release WASM)
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Run contract unit tests
        run: cargo test

      - name: Check contract formatting
        run: cargo fmt --check

      - name: Clippy lint
        run: cargo clippy -- -D warnings

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Backend smoke tests
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend Smoke Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        run: npm install

      - name: Create test environment
        run: |
          cp .env.example .env
          echo "STELLAR_WEB_AUTH_SECRET=SCZANGBA5RLMPI7JMTP2BJ2GRNJ4XNYLA7PNHBBFNEZDBE3ENTNQPTNO" >> .env
          echo "JWT_SECRET=ci-test-secret-key-grow2stellar" >> .env
          echo "PORT=4000" >> .env

      - name: Start backend server
        run: node src/server.js &
        env:
          NODE_ENV: test

      - name: Wait for server to be ready
        run: |
          for i in {1..15}; do
            curl -sf http://localhost:4000/health && break || sleep 2
          done

      - name: Run smoke tests
        run: npm run smoke

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Frontend build
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm install

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://grow2stellar-api.onrender.com

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Deploy to Vercel (main branch only)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [contract, backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        run: |
          vercel --token ${{ secrets.VERCEL_TOKEN }} \
                 --prod \
                 --yes \
                 --cwd frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
